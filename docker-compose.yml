# Local and self-hosted setup: Postgres, a one-shot migration, the worker and the bot.
#   cp .env.example .env && cp config.example.yaml config.yaml   # then edit both
#   docker compose up -d --build

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://jobscout:${POSTGRES_PASSWORD:-jobscout}@postgres:5432/jobscout
    CONFIG_PATH: /config/config.yaml
  volumes:
    - ./config.yaml:/config/config.yaml:ro
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobscout}
      POSTGRES_DB: jobscout
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # reachable from this machine only, for `pnpm dev:*` and psql
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobscout -d jobscout']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://jobscout:${POSTGRES_PASSWORD:-jobscout}@postgres:5432/jobscout
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ['node', 'dist/worker/main.js']

  bot:
    <<: *app
    command: ['node', 'dist/bot/main.js']

volumes:
  pgdata:
